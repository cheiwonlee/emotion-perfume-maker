<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Mood Perfume Maker</title>
  <meta name="description" content="기분에 맞춰 향수를 섞는 IoT 향수 제조기의 실시간 대시보드. 부품 없이 브라우저에서 가상 보드로 체험할 수 있어요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M11 3h10v4h-2v4.5c4 1.4 7 5 7 9.5a10 10 0 0 1-20 0c0-4.5 3-8.1 7-9.5V7h-2z' fill='%238d7bb8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="top">
    <p class="brand">Daily Mood Perfume Maker</p>
    <div class="top-right">
      <p class="link" id="link"><span class="dot"></span><span id="link-text"></span></p>
      <button type="button" class="ghost" id="serial-btn" hidden>USB로 연결</button>
      <button type="button" class="ghost" id="lcd-toggle" aria-controls="lcd-window" aria-pressed="false" hidden>가상 LCD 열기</button>
      <p class="mode-label" id="mode-label" hidden></p>
      <button type="button" class="text-btn" id="mode-btn" hidden>모드 바꾸기</button>
    </div>
  </header>

  <section class="chooser" id="chooser" hidden aria-labelledby="chooser-title">
    <h1 id="chooser-title">어떤 보드와 연결할까요?</h1>
    <p class="chooser-lead">나중에 위쪽의 ‘모드 바꾸기’로 언제든 다시 고를 수 있어요.</p>
    <ul class="modes">
      <li>
        <button type="button" class="mode" data-mode="virtual">
          <span class="mode-name">가상 보드</span>
          <span class="mode-desc">부품 없이 브라우저 안에서 메인보드·서브보드·센서를 흉내 내요. 화면의 LCD를 눌러 향수를 만들어 보세요.</span>
          <span class="mode-note"></span>
        </button>
      </li>
      <li>
        <button type="button" class="mode" data-mode="serial">
          <span class="mode-name">실제 보드 (USB)</span>
          <span class="mode-desc">메인보드를 USB로 연결하면 시리얼 출력을 브라우저가 바로 읽어요. 서버가 필요 없어요.</span>
          <span class="mode-note"></span>
        </button>
      </li>
      <li>
        <button type="button" class="mode" data-mode="server">
          <span class="mode-name">로컬 서버</span>
          <span class="mode-desc"><code>python run.py</code>로 띄운 서버의 상태를 보여 줘요. 제조 기록이 서버 DB에 남아요.</span>
          <span class="mode-note"></span>
        </button>
      </li>
    </ul>
  </section>

  <main id="dashboard" hidden>
    <section class="status" id="status" aria-live="polite" aria-labelledby="headline">
      <div class="status-top">
        <p class="chip" id="chip">대기</p>
        <ol class="stages" id="stages" aria-label="진행 단계">
          <li data-stage="SCREEN_START">대기</li>
          <li data-stage="SCREEN_MOODSELECT">기분 선택</li>
          <li data-stage="SCREEN_CONFIRM">확인</li>
          <li data-stage="SCREEN_BLENDING">주입</li>
          <li data-stage="SCREEN_FINISH">완료</li>
        </ol>
      </div>
      <div class="status-main">
        <div>
          <h1 class="headline" id="headline">보드 신호를 기다리는 중</h1>
          <p class="subline" id="subline"></p>
        </div>
        <p class="percent" id="percent" hidden><span id="percent-num">0</span>%</p>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden></div>
      <ol class="legend" id="legend" hidden></ol>
    </section>

    <div class="panels">
      <section class="panel" aria-labelledby="tanks-title">
        <div class="panel-head">
          <h2 id="tanks-title">향료 통</h2>
          <div class="sim-controls" id="sim-controls" hidden>
            <label class="switch"><input type="checkbox" id="auto"> <span>자동 시연</span></label>
            <button type="button" class="text-btn" id="refill">모두 채우기</button>
          </div>
        </div>
        <ol class="vials" id="vials"></ol>
        <p class="hint panel-foot" id="organ-hint"></p>
      </section>

      <section class="panel" aria-labelledby="log-title">
        <div class="panel-head">
          <h2 id="log-title">제조 기록</h2>
          <p class="hint" id="today"></p>
        </div>
        <ol class="blends" id="blends"></ol>
      </section>
    </div>
  </main>

  <!-- 가상 터치 LCD: 대시보드 위에 떠 있는 창. 제목 막대를 끌어서 옮긴다 -->
  <div class="lcd-window" id="lcd-window" role="dialog" aria-labelledby="lcd-window-title" hidden>
    <div class="lcd-bar" id="lcd-bar" tabindex="0" title="끌어서 옮기기 (방향키로도 옮길 수 있어요)">
      <span class="grip" aria-hidden="true"></span>
      <span id="lcd-window-title">터치 LCD</span>
      <button type="button" class="lcd-close" id="lcd-close" aria-label="가상 LCD 닫기">&times;</button>
    </div>
    <div class="unit">
      <div class="lcd" id="lcd" role="group" aria-label="가상 터치 LCD 화면"></div>
    </div>
    <p class="lcd-caption">메인보드에 연결된 터치 LCD를 흉내 낸 화면이에요.</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
